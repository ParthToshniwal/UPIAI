services:
  - type: web
    name: upiai-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: upiai_db
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
